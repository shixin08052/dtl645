name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: 单元测试
        run: dotnet test tests/Dlt645.Core.Tests -c Release

      - name: 发布单文件 exe
        run: >
          dotnet publish src/Dlt645.App -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=none -p:DebugSymbols=false
          -o publish

      - name: 界面自检（模拟电表，自动走遍所有页面）
        shell: pwsh
        run: |
          $p = Start-Process -FilePath publish/Dlt645Reader.exe -ArgumentList '--selftest' -PassThru
          $null = $p.Handle
          if (-not $p.WaitForExit(300000)) { $p.Kill(); Get-Content publish/logs/*.log -Encoding UTF8 | Where-Object { $_ -notmatch '\[报文\]' } | Select-Object -Last 150; throw '自检超时' }
          Get-Content publish/logs/*.log -Encoding UTF8 | Where-Object { $_ -notmatch '\[报文\]' } | Select-Object -Last 120
          if ($p.ExitCode -ne 0) { throw "自检失败，退出码 $($p.ExitCode)" }

      - uses: actions/upload-artifact@v4
        with:
          name: Dlt645Reader-win-x64
          path: publish/Dlt645Reader.exe
